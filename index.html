<!doctype html>
<html lang="id">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lomba Mengetik SMP</title>
  <script src="/_sdk/data_sdk.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      box-sizing: border-box;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .fade-in {
      animation: fadeIn 0.3s ease-out;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .pulse {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    
    .typing-text {
      font-family: 'Courier New', monospace;
      line-height: 1.8;
      letter-spacing: 0.5px;
    }
    
    .correct-char {
      color: #10b981;
    }
    
    .incorrect-char {
      color: #ef4444;
      background-color: #fee2e2;
    }
    
    .gradient-bg {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    .glass-effect {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
 </head>
 <body class="w-full h-full min-h-full gradient-bg">
  <div id="app" class="w-full min-h-full p-4"></div>
  <script>
    const defaultConfig = {
      app_title: "Lomba Mengetik SMP",
      welcome_message: "Selamat datang di lomba mengetik!",
      admin_password: "admin123",
      primary_color: "#667eea",
      secondary_color: "#ffffff",
      text_color: "#1f2937",
      success_color: "#10b981",
      accent_color: "#764ba2",
      font_family: "Inter, sans-serif",
      font_size: 16
    };

    let allRecords = [];
    let currentView = 'login';
    let currentUser = null;
    let userType = null;
    
    // Typing test state
    let typingTestActive = false;
    let startTime = null;
    let testText = "";
    let userInput = "";
    let currentTestId = null;

    const sampleTexts = [
      "Pendidikan adalah kunci kesuksesan. Belajar dengan giat akan membawa masa depan yang cerah. Rajin membaca buku akan menambah ilmu pengetahuan.",
      "Indonesia adalah negara kepulauan yang kaya akan budaya dan bahasa. Setiap daerah memiliki keunikan tersendiri yang patut kita jaga dan lestarikan.",
      "Teknologi berkembang sangat pesat di era modern ini. Kita harus terus belajar dan beradaptasi dengan perubahan yang terjadi di sekitar kita.",
      "Persahabatan adalah harta yang tak ternilai harganya. Teman sejati akan selalu ada di saat suka maupun duka dalam kehidupan kita.",
      "Olahraga sangat penting untuk menjaga kesehatan tubuh dan pikiran. Rutin berolahraga akan membuat kita lebih bugar dan bersemangat."
    ];

    const dataHandler = {
      onDataChanged(data) {
        allRecords = data;
        renderCurrentView();
      }
    };

    async function initApp() {
      const initResult = await window.dataSdk.init(dataHandler);
      if (!initResult.isOk) {
        console.error("Failed to initialize data SDK");
        return;
      }
      
      await window.elementSdk.init({
        defaultConfig,
        onConfigChange: updateUI,
        mapToCapabilities: (config) => ({
          recolorables: [
            {
              get: () => config.primary_color || defaultConfig.primary_color,
              set: (value) => {
                config.primary_color = value;
                window.elementSdk.setConfig({ primary_color: value });
              }
            },
            {
              get: () => config.secondary_color || defaultConfig.secondary_color,
              set: (value) => {
                config.secondary_color = value;
                window.elementSdk.setConfig({ secondary_color: value });
              }
            },
            {
              get: () => config.text_color || defaultConfig.text_color,
              set: (value) => {
                config.text_color = value;
                window.elementSdk.setConfig({ text_color: value });
              }
            },
            {
              get: () => config.success_color || defaultConfig.success_color,
              set: (value) => {
                config.success_color = value;
                window.elementSdk.setConfig({ success_color: value });
              }
            },
            {
              get: () => config.accent_color || defaultConfig.accent_color,
              set: (value) => {
                config.accent_color = value;
                window.elementSdk.setConfig({ accent_color: value });
              }
            }
          ],
          borderables: [],
          fontEditable: {
            get: () => config.font_family || defaultConfig.font_family,
            set: (value) => {
              config.font_family = value;
              window.elementSdk.setConfig({ font_family: value });
            }
          },
          fontSizeable: {
            get: () => config.font_size || defaultConfig.font_size,
            set: (value) => {
              config.font_size = value;
              window.elementSdk.setConfig({ font_size: value });
            }
          }
        }),
        mapToEditPanelValues: (config) => new Map([
          ["app_title", config.app_title || defaultConfig.app_title],
          ["welcome_message", config.welcome_message || defaultConfig.welcome_message],
          ["admin_password", config.admin_password || defaultConfig.admin_password]
        ])
      });
      
      renderCurrentView();
    }

    function updateUI(config) {
      const customFont = config.font_family || defaultConfig.font_family;
      const baseSize = config.font_size || defaultConfig.font_size;
      const baseFontStack = 'system-ui, -apple-system, sans-serif';
      
      document.body.style.fontFamily = `${customFont}, ${baseFontStack}`;
      
      const appTitle = document.getElementById('app-title');
      if (appTitle) {
        appTitle.textContent = config.app_title || defaultConfig.app_title;
        appTitle.style.fontSize = `${baseSize * 2}px`;
        appTitle.style.color = config.text_color || defaultConfig.text_color;
      }
      
      const welcomeMsg = document.getElementById('welcome-message');
      if (welcomeMsg) {
        welcomeMsg.textContent = config.welcome_message || defaultConfig.welcome_message;
        welcomeMsg.style.fontSize = `${baseSize * 1.125}px`;
        welcomeMsg.style.color = config.text_color || defaultConfig.text_color;
      }
      
      const allButtons = document.querySelectorAll('.primary-btn');
      allButtons.forEach(btn => {
        btn.style.backgroundColor = config.primary_color || defaultConfig.primary_color;
        btn.style.fontSize = `${baseSize}px`;
      });
      
      const allCards = document.querySelectorAll('.glass-effect');
      allCards.forEach(card => {
        card.style.backgroundColor = config.secondary_color || defaultConfig.secondary_color;
      });
      
      const allText = document.querySelectorAll('.text-content');
      allText.forEach(text => {
        text.style.color = config.text_color || defaultConfig.text_color;
        text.style.fontSize = `${baseSize}px`;
      });
      
      const allLabels = document.querySelectorAll('.label-text');
      allLabels.forEach(label => {
        label.style.fontSize = `${baseSize * 0.875}px`;
        label.style.color = config.text_color || defaultConfig.text_color;
      });
    }

    function renderCurrentView() {
      const app = document.getElementById('app');
      
      if (currentView === 'login') {
        app.innerHTML = renderLoginView();
      } else if (currentView === 'admin-login') {
        app.innerHTML = renderAdminLogin();
      } else if (currentView === 'participant-form') {
        app.innerHTML = renderParticipantForm();
      } else if (currentView === 'typing-test') {
        app.innerHTML = renderTypingTest();
      } else if (currentView === 'admin-dashboard') {
        app.innerHTML = renderAdminDashboard();
      }
      
      updateUI(window.elementSdk?.config || defaultConfig);
    }

    function renderLoginView() {
      return `
        <div class="w-full max-w-md mx-auto fade-in" style="padding-top: 10%;">
          <div class="glass-effect rounded-2xl p-8 shadow-xl">
            <h1 id="app-title" class="text-content font-bold mb-2 text-center">Lomba Mengetik SMP</h1>
            <p id="welcome-message" class="text-content text-center mb-8">Selamat datang di lomba mengetik!</p>
            
            <div class="space-y-4">
              <button onclick="selectUserType('participant')" class="primary-btn w-full py-4 rounded-xl font-semibold transition-all hover:scale-105 hover:shadow-lg">
                👨‍🎓 Masuk Sebagai Peserta
              </button>
              
              <button onclick="selectUserType('admin')" class="w-full py-4 rounded-xl font-semibold transition-all hover:scale-105 hover:shadow-lg text-content" style="background-color: rgba(255, 255, 255, 0.3);">
                🔐 Masuk Sebagai Admin
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function selectUserType(type) {
      userType = type;
      if (type === 'participant') {
        currentView = 'participant-form';
      } else {
        showAdminLogin();
      }
      renderCurrentView();
    }

    function showAdminLogin() {
      currentView = 'admin-login';
      renderCurrentView();
    }

    function handleAdminLogin(event) {
      event.preventDefault();
      const password = document.getElementById('admin-password-input').value;
      const correctPassword = window.elementSdk?.config?.admin_password || defaultConfig.admin_password;
      
      if (password === correctPassword) {
        currentUser = { name: 'Admin', type: 'admin' };
        currentView = 'admin-dashboard';
        renderCurrentView();
      } else {
        const errorDiv = document.getElementById('admin-error');
        errorDiv.textContent = 'Password salah!';
        errorDiv.classList.remove('hidden');
      }
    }

    function renderAdminLogin() {
      return `
        <div class="w-full max-w-md mx-auto fade-in" style="padding-top: 10%;">
          <div class="glass-effect rounded-2xl p-8 shadow-xl">
            <h2 class="text-content font-bold mb-6 text-center" style="font-size: ${(window.elementSdk?.config?.font_size || defaultConfig.font_size) * 1.5}px;">Login Admin</h2>
            
            <form onsubmit="handleAdminLogin(event)" class="space-y-4">
              <div>
                <label class="label-text block mb-2 font-medium">Password Admin</label>
                <input type="password" id="admin-password-input" required class="w-full px-4 py-3 rounded-lg border-2 text-content" style="border-color: ${window.elementSdk?.config?.primary_color || defaultConfig.primary_color};">
              </div>
              
              <div id="admin-error" class="text-red-500 text-sm hidden"></div>
              
              <div class="flex gap-3">
                <button type="button" onclick="backToLogin()" class="flex-1 py-3 rounded-lg font-semibold text-content" style="background-color: rgba(0, 0, 0, 0.1);">
                  Kembali
                </button>
                <button type="submit" class="primary-btn flex-1 py-3 rounded-lg font-semibold">
                  Masuk
                </button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function renderParticipantForm() {
      return `
        <div class="w-full max-w-md mx-auto fade-in" style="padding-top: 10%;">
          <div class="glass-effect rounded-2xl p-8 shadow-xl">
            <h2 class="text-content font-bold mb-6 text-center" style="font-size: ${(window.elementSdk?.config?.font_size || defaultConfig.font_size) * 1.5}px;">Data Peserta</h2>
            
            <form onsubmit="handleParticipantSubmit(event)" class="space-y-4">
              <div>
                <label class="label-text block mb-2 font-medium">Nama Lengkap</label>
                <input type="text" id="participant-name" required class="w-full px-4 py-3 rounded-lg border-2 text-content" placeholder="Masukkan nama lengkap">
              </div>
              
              <div>
                <label class="label-text block mb-2 font-medium">Kelas</label>
                <select id="participant-class" required class="w-full px-4 py-3 rounded-lg border-2 text-content">
                  <option value="">Pilih kelas</option>
                  <option value="7A">7A</option>
                  <option value="7B">7B</option>
                  <option value="7C">7C</option>
                  <option value="8A">8A</option>
                  <option value="8B">8B</option>
                  <option value="8C">8C</option>
                  <option value="9A">9A</option>
                  <option value="9B">9B</option>
                  <option value="9C">9C</option>
                </select>
              </div>
              
              <div class="flex gap-3 pt-2">
                <button type="button" onclick="backToLogin()" class="flex-1 py-3 rounded-lg font-semibold text-content" style="background-color: rgba(0, 0, 0, 0.1);">
                  Kembali
                </button>
                <button type="submit" class="primary-btn flex-1 py-3 rounded-lg font-semibold">
                  Mulai Tes
                </button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function handleParticipantSubmit(event) {
      event.preventDefault();
      const name = document.getElementById('participant-name').value;
      const classValue = document.getElementById('participant-class').value;
      
      currentUser = { name, class: classValue, type: 'participant' };
      currentView = 'typing-test';
      renderCurrentView();
    }

    function backToLogin() {
      currentView = 'login';
      currentUser = null;
      userType = null;
      renderCurrentView();
    }

    function renderTypingTest() {
      testText = sampleTexts[Math.floor(Math.random() * sampleTexts.length)];
      userInput = "";
      typingTestActive = false;
      startTime = null;
      
      return `
        <div class="w-full max-w-4xl mx-auto fade-in" style="padding-top: 5%;">
          <div class="glass-effect rounded-2xl p-8 shadow-xl">
            <div class="flex justify-between items-center mb-6">
              <div>
                <h2 class="text-content font-bold" style="font-size: ${(window.elementSdk?.config?.font_size || defaultConfig.font_size) * 1.5}px;">Tes Mengetik</h2>
                <p class="text-content" style="font-size: ${(window.elementSdk?.config?.font_size || defaultConfig.font_size) * 0.875}px;">${currentUser.name} - Kelas ${currentUser.class}</p>
              </div>
              <div class="text-right">
                <div id="timer" class="text-content font-bold" style="font-size: ${(window.elementSdk?.config?.font_size || defaultConfig.font_size) * 2}px;">0:00</div>
                <div id="wpm-display" class="text-content" style="font-size: ${(window.elementSdk?.config?.font_size || defaultConfig.font_size) * 0.875}px;">0 WPM</div>
              </div>
            </div>
            
            <div class="mb-6 p-6 rounded-lg" style="background-color: rgba(0, 0, 0, 0.05);">
              <div id="test-text" class="typing-text text-content" style="font-size: ${(window.elementSdk?.config?.font_size || defaultConfig.font_size) * 1.125}px;">${testText}</div>
            </div>
            
            <div class="mb-4">
              <textarea id="typing-input" rows="4" placeholder="Ketik teks di atas. Tes akan dimulai saat Anda mengetik..." class="w-full px-4 py-3 rounded-lg border-2 typing-text text-content resize-none" style="font-size: ${(window.elementSdk?.config?.font_size || defaultConfig.font_size) * 1.125}px;"></textarea>
            </div>
            
            <div class="flex gap-3">
              <button onclick="backToParticipantForm()" class="flex-1 py-3 rounded-lg font-semibold text-content" style="background-color: rgba(0, 0, 0, 0.1);">
                Kembali
              </button>
              <button onclick="finishTest()" id="finish-btn" class="primary-btn flex-1 py-3 rounded-lg font-semibold" disabled>
                Selesai
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function backToParticipantForm() {
      currentView = 'participant-form';
      renderCurrentView();
    }

    document.addEventListener('input', function(e) {
      if (e.target.id === 'typing-input') {
        handleTypingInput(e);
      }
    });

    document.addEventListener('submit', function(e) {
      if (e.target.querySelector('#admin-password-input')) {
        handleAdminLogin(e);
      }
    });

    function handleTypingInput(e) {
      const input = e.target.value;
      
      if (!typingTestActive && input.length > 0) {
        typingTestActive = true;
        startTime = Date.now();
        startTimer();
        document.getElementById('finish-btn').disabled = false;
      }
      
      userInput = input;
      updateTestDisplay();
      updateWPM();
    }

    function updateTestDisplay() {
      const testTextDiv = document.getElementById('test-text');
      let displayHTML = '';
      
      for (let i = 0; i < testText.length; i++) {
        if (i < userInput.length) {
          if (userInput[i] === testText[i]) {
            displayHTML += `<span class="correct-char">${testText[i]}</span>`;
          } else {
            displayHTML += `<span class="incorrect-char">${testText[i]}</span>`;
          }
        } else {
          displayHTML += testText[i];
        }
      }
      
      testTextDiv.innerHTML = displayHTML;
    }

    function startTimer() {
      const timerInterval = setInterval(() => {
        if (!typingTestActive) {
          clearInterval(timerInterval);
          return;
        }
        
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const minutes = Math.floor(elapsed / 60);
        const seconds = elapsed % 60;
        document.getElementById('timer').textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
      }, 1000);
    }

    function updateWPM() {
      if (!startTime) return;
      
      const elapsed = (Date.now() - startTime) / 1000 / 60;
      const words = userInput.trim().split(/\s+/).length;
      const wpm = Math.round(words / elapsed) || 0;
      
      document.getElementById('wpm-display').textContent = `${wpm} WPM`;
    }

    async function finishTest() {
      if (!typingTestActive) return;
      
      typingTestActive = false;
      
      const elapsed = (Date.now() - startTime) / 1000 / 60;
      const words = userInput.trim().split(/\s+/).length;
      const wpm = Math.round(words / elapsed) || 0;
      
      let correctChars = 0;
      for (let i = 0; i < Math.min(userInput.length, testText.length); i++) {
        if (userInput[i] === testText[i]) correctChars++;
      }
      const accuracy = Math.round((correctChars / testText.length) * 100);
      
      const finishBtn = document.getElementById('finish-btn');
      finishBtn.textContent = 'Menyimpan...';
      finishBtn.disabled = true;
      
      const result = await window.dataSdk.create({
        participant_id: Date.now().toString(),
        name: currentUser.name,
        class: currentUser.class,
        wpm: wpm,
        accuracy: accuracy,
        timestamp: new Date().toISOString()
      });
      
      if (result.isOk) {
        showResultModal(wpm, accuracy);
      } else {
        finishBtn.textContent = 'Gagal menyimpan! Coba lagi';
        finishBtn.disabled = false;
      }
    }

    function showResultModal(wpm, accuracy) {
      const app = document.getElementById('app');
      const modal = document.createElement('div');
      modal.className = 'fixed inset-0 flex items-center justify-center p-4 fade-in';
      modal.style.backgroundColor = 'rgba(0, 0, 0, 0.5)';
      modal.style.zIndex = '1000';
      
      modal.innerHTML = `
        <div class="glass-effect rounded-2xl p-8 max-w-md w-full shadow-2xl">
          <div class="text-center">
            <div class="text-6xl mb-4">🎉</div>
            <h3 class="text-content font-bold mb-4" style="font-size: ${(window.elementSdk?.config?.font_size || defaultConfig.font_size) * 1.75}px;">Tes Selesai!</h3>
            
            <div class="space-y-3 mb-6">
              <div class="p-4 rounded-lg" style="background-color: rgba(16, 185, 129, 0.1);">
                <div class="text-content" style="font-size: ${(window.elementSdk?.config?.font_size || defaultConfig.font_size) * 0.875}px;">Kecepatan</div>
                <div class="font-bold" style="font-size: ${(window.elementSdk?.config?.font_size || defaultConfig.font_size) * 2}px; color: ${window.elementSdk?.config?.success_color || defaultConfig.success_color};">${wpm} WPM</div>
              </div>
              
              <div class="p-4 rounded-lg" style="background-color: rgba(16, 185, 129, 0.1);">
                <div class="text-content" style="font-size: ${(window.elementSdk?.config?.font_size || defaultConfig.font_size) * 0.875}px;">Akurasi</div>
                <div class="font-bold" style="font-size: ${(window.elementSdk?.config?.font_size || defaultConfig.font_size) * 2}px; color: ${window.elementSdk?.config?.success_color || defaultConfig.success_color};">${accuracy}%</div>
              </div>
            </div>
            
            <button onclick="backToLogin()" class="primary-btn w-full py-3 rounded-lg font-semibold">
              Selesai
            </button>
          </div>
        </div>
      `;
      
      app.appendChild(modal);
    }

    function renderAdminDashboard() {
      const sortedRecords = [...allRecords].sort((a, b) => b.wpm - a.wpm);
      const top10 = sortedRecords.slice(0, 10);
      
      return `
        <div class="w-full max-w-7xl mx-auto fade-in p-4">
          <div class="glass-effect rounded-2xl p-8 shadow-xl mb-6">
            <div class="flex justify-between items-center mb-6">
              <div>
                <h2 class="text-content font-bold" style="font-size: ${(window.elementSdk?.config?.font_size || defaultConfig.font_size) * 1.75}px;">Dashboard Admin</h2>
                <p class="text-content" style="font-size: ${(window.elementSdk?.config?.font_size || defaultConfig.font_size) * 0.875}px;">Total Peserta: ${allRecords.length}</p>
              </div>
              <button onclick="backToLogin()" class="py-2 px-6 rounded-lg font-semibold text-content" style="background-color: rgba(0, 0, 0, 0.1);">
                Keluar
              </button>
            </div>
          </div>
          
          <div class="glass-effect rounded-2xl p-8 shadow-xl mb-6">
            <h3 class="text-content font-bold mb-4" style="font-size: ${(window.elementSdk?.config?.font_size || defaultConfig.font_size) * 1.5}px;">🏆 10 Peserta Terbaik</h3>
            <div class="space-y-3">
              ${top10.map((record, index) => `
                <div class="p-4 rounded-lg flex items-center gap-4" style="background-color: ${index < 3 ? 'rgba(251, 191, 36, 0.1)' : 'rgba(0, 0, 0, 0.05)'};">
                  <div class="font-bold text-center" style="font-size: ${(window.elementSdk?.config?.font_size || defaultConfig.font_size) * 1.5}px; width: 40px; color: ${window.elementSdk?.config?.primary_color || defaultConfig.primary_color};">
                    ${index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `#${index + 1}`}
                  </div>
                  <div class="flex-1">
                    <div class="text-content font-semibold" style="font-size: ${(window.elementSdk?.config?.font_size || defaultConfig.font_size) * 1.125}px;">${record.name}</div>
                    <div class="text-content" style="font-size: ${(window.elementSdk?.config?.font_size || defaultConfig.font_size) * 0.875}px;">Kelas ${record.class}</div>
                  </div>
                  <div class="text-right">
                    <div class="font-bold" style="font-size: ${(window.elementSdk?.config?.font_size || defaultConfig.font_size) * 1.5}px; color: ${window.elementSdk?.config?.success_color || defaultConfig.success_color};">${record.wpm} WPM</div>
                    <div class="text-content" style="font-size: ${(window.elementSdk?.config?.font_size || defaultConfig.font_size) * 0.875}px;">${record.accuracy}% akurat</div>
                  </div>
                </div>
              `).join('') || '<p class="text-center text-content py-8">Belum ada peserta yang menyelesaikan tes</p>'}
            </div>
          </div>
          
          <div class="glass-effect rounded-2xl p-8 shadow-xl">
            <h3 class="text-content font-bold mb-4" style="font-size: ${(window.elementSdk?.config?.font_size || defaultConfig.font_size) * 1.5}px;">📊 Semua Hasil</h3>
            <div class="overflow-x-auto">
              <table class="w-full">
                <thead>
                  <tr style="border-bottom: 2px solid rgba(0, 0, 0, 0.1);">
